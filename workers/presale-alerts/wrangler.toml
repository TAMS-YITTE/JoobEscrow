name = "joob-presale-alerts"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
# Chaque minute : alertes d'achat. 14:05 UTC : classement Top Buyers (aux dates de TOP_BUYERS).
crons = [ "* * * * *", "5 14 * * *" ]

# Curseur dans un Durable Object (offre gratuite, stockage SQLite) : un seul
# exemplaire, sans delai de propagation, une execution a la fois.
[[durable_objects.bindings]]
name = "ALERTS"
class_name = "AlertsRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertsRunner"]

# Ancien stockage du curseur, lu une fois pour reprendre ou il en etait.
[[kv_namespaces]]
binding = "STATE"
id = "b4b4b9ae03864ae7a4a51dda80b5fd5e"

[vars]
PRESALE_ADDRESS = "0xd3F3598Ff8efB2cF6643488e66e8df683804F63d"
# Appels simples (blockNumber, totalRaised) : premier qui repond.
RPC_URLS = "https://bsc-dataseed.bnbchain.org,https://bsc-dataseed1.defibit.io,https://bsc-rpc.publicnode.com"
# eth_getLogs, seulement quand totalRaised a bouge : seul RPC public gratuit qui l'accepte sur 2 000 blocs.
LOGS_RPC_URLS = "https://bsc-rpc.publicnode.com"
# Tranches du RPC de secours (secret FALLBACK_RPC_URL) : NodeReal accepte 50 000 blocs par eth_getLogs.
FALLBACK_RANGE = "50000"
DRY_RUN = "0"
SAFE_ADDRESS = "0x872F979aa868145bE3c3A6EA787614BE2A18C7f7"
# Concours Top Buyers : signataires du Safe exclus d'office (lus on-chain). Cagnotte affichee a partir de showPoolFrom USDT.
TOP_BUYERS = '{"name":"Top Buyers","start":"2026-10-27T14:00:00Z","end":"2026-11-02T14:00:00Z","postDates":["2026-10-30","2026-11-01"],"poolBps":1000,"poolCap":500,"showPoolFrom":50,"splitBps":[5000,3000,2000],"exclude":[]}'

[observability]
enabled = true
